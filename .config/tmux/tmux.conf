# tmux as a host for TUI agents (agmsg-driven-development spawns Codex panes).
# Not a daily multiplexer — cmux fills that role — so keep this minimal.

# Pass truecolor through: the outer terminal (Ghostty) is RGB-capable, but tmux
# downgrades color unless the outer TERM is told it supports RGB.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g  mouse on         # scroll / focus the spawned Codex panes with the trackpad
set -sg escape-time 0    # remove ESC lag in the claude / Codex TUIs
set -g  history-limit 50000  # keep enough scrollback to review Codex output
